name: iOS TestFlight

# No push/tag triggers. Nothing is uploaded by the preview workflow.
# Before enabling: see app-shell/RELEASE-READINESS.md and obtain Nav's approval.
on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: 'Upload a signed build to App Store Connect (requires approval)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirm_upload && vars.MOBILE_STORE_UPLOADS_ENABLED == 'true'
    # The environment's required reviewer approves each run before the store
    # secrets are released to it. See app-shell/README.md.
    environment: store-uploads
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-shell
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-shell/package-lock.json
      - name: Select the newest Xcode 26 on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npx cap sync ios
      - run: npm run check -- ios
      - name: Sign, archive and upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/release-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-signed-build
          path: ${{ runner.temp }}/ios-export/*.ipa
          retention-days: 7
