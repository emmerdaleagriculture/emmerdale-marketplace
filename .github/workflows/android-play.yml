# .github/workflows/android-play.yml
#
# Builds the Capacitor Android app and uploads it to the Play Console's
# internal testing track. Runs on Linux, so it is cheaper and faster than the
# iOS job and needs no Apple hardware at all.
#
# ─── REQUIRED REPO SECRETS ───────────────────────────────────────────────
#   ANDROID_KEYSTORE_BASE64      your release keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            key alias inside the keystore
#   ANDROID_KEY_PASSWORD         password for that alias
#   PLAY_SERVICE_ACCOUNT_JSON    Google Play service-account JSON, pasted whole
#
# ⚠️  THE KEYSTORE IS IRREPLACEABLE. If it is lost, Google will not let you
#     update this app ever again under the same listing — a new listing and a
#     new URL would be the only option. Back the .jks file up somewhere
#     outside this repo (a password manager is ideal) before you start.
#
# Create a keystore once, on any machine with a JDK:
#   keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 \
#           -validity 10000 -alias emmerdale
#   base64 -i release.jks | pbcopy     # paste into ANDROID_KEYSTORE_BASE64

name: Android Play

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo -n "$KEYSTORE_B64" | base64 --decode > android/app/release.jks

      - name: Build signed release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.emmerdaleagriculture.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Keep the bundle as an artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Remove keystore from the runner
        if: always()
        run: rm -f android/app/release.jks
