name: Android Play

# First AAB may need manual Play Console upload before publishing API is usable.
# This workflow NEVER publishes to production. See app-shell/RELEASE-READINESS.md.
on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: 'Upload signed AAB to Play internal testing as a draft (requires approval)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-play-upload
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirm_upload && vars.MOBILE_STORE_UPLOADS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-shell
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-shell/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - run: npx cap sync ios
      - run: npm run check
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed Android bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing $name"; exit 1; fi
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/emmerdale-upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-bundle
          path: app-shell/android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
      - name: Upload draft to internal testing only
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.emmerdaleagriculture.app
          releaseFiles: app-shell/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
